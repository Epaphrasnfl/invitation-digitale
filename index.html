<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Epaphras & Consolate — 06 Juin 2027</title>

    <meta name="description" content="Invitation au mariage de Epaphras & Consolate — 06 Juin 2027">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
            background: #111;
            color: white;
            overflow: hidden;
        }

        /* =========================
           COUVERTURE
        ========================= */

        .cover {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            overflow: hidden;

            background-image:
                linear-gradient(
                    rgba(20, 15, 10, 0.42),
                    rgba(20, 15, 10, 0.58)
                ),
                url("images/couple-principale.jpg");

            background-size: cover;
            background-position: center;
        }

        /* Léger effet de zoom */

        .cover::before {
            content: "";
            position: absolute;
            inset: 0;

            background-image: url("images/couple-principale.jpg");
            background-size: cover;
            background-position: center;

            transform: scale(1.04);

            animation: zoomPhoto 12s ease-in-out infinite alternate;

            z-index: 0;
        }

        /* Voile par-dessus la photo */

        .cover::after {
            content: "";
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.15),
                    rgba(0,0,0,0.25) 45%,
                    rgba(0,0,0,0.65)
                );

            z-index: 1;
        }

        /* =========================
           DÉCORATIONS
        ========================= */

        .decoration {
            position: absolute;
            width: 220px;
            height: 220px;

            border: 1px solid rgba(255,255,255,0.25);

            border-radius: 50%;

            pointer-events: none;

            z-index: 2;
        }

        .decoration.one {
            top: -120px;
            left: -110px;
        }

        .decoration.two {
            bottom: -120px;
            right: -110px;
        }

        .line {
            position: absolute;

            width: 1px;
            height: 70px;

            background:
                linear-gradient(
                    to bottom,
                    transparent,
                    rgba(255,255,255,0.7),
                    transparent
                );

            z-index: 2;
        }

        .line.top {
            top: 25px;
            left: 50%;
        }

        .line.bottom {
            bottom: 25px;
            left: 50%;
        }

        /* =========================
           CONTENU
        ========================= */

        .content {
            position: relative;

            z-index: 3;

            width: min(90%, 600px);

            display: flex;
            flex-direction: column;
            align-items: center;

            animation: fadeIn 2s ease forwards;
        }

        .small-title {
            font-family: Arial, sans-serif;

            font-size: 11px;

            letter-spacing: 5px;

            text-transform: uppercase;

            margin-bottom: 28px;

            color: rgba(255,255,255,0.9);

            animation: slideDown 1.2s ease forwards;
        }

        .names {
            font-size: clamp(48px, 14vw, 82px);

            font-weight: normal;

            line-height: 0.95;

            letter-spacing: -2px;

            color: white;

            text-shadow:
                0 3px 20px rgba(0,0,0,0.35);

            animation: fadeUp 1.5s ease .2s both;
        }

        .ampersand {
            display: block;

            margin: 12px 0;

            font-family: "Times New Roman", serif;

            font-size: clamp(28px, 8vw, 42px);

            font-style: italic;

            color: #e2c28b;
        }

        .date {
            margin-top: 32px;

            font-family: Arial, sans-serif;

            font-size: 13px;

            letter-spacing: 4px;

            text-transform: uppercase;

            color: rgba(255,255,255,0.95);

            animation: fadeUp 1.5s ease .5s both;
        }

        .message {
            max-width: 390px;

            margin-top: 25px;

            font-size: 15px;

            line-height: 1.8;

            font-style: italic;

            color: rgba(255,255,255,0.9);

            text-shadow:
                0 2px 10px rgba(0,0,0,0.4);

            animation: fadeUp 1.5s ease .7s both;
        }

        /* =========================
           BOUTON
        ========================= */

        .open-button {
            position: relative;

            margin-top: 38px;

            padding: 15px 34px;

            border: 1px solid rgba(255,255,255,0.75);

            border-radius: 50px;

            background: rgba(255,255,255,0.08);

            backdrop-filter: blur(6px);

            color: white;

            font-family: Arial, sans-serif;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 3px;

            text-transform: uppercase;

            cursor: pointer;

            transition:
                background .3s ease,
                transform .3s ease,
                box-shadow .3s ease;

            animation: fadeUp 1.5s ease .9s both;
        }

        .open-button:hover {
            background: rgba(255,255,255,0.2);

            transform: translateY(-3px);

            box-shadow:
                0 10px 30px rgba(0,0,0,0.3);
        }

        .open-button:active {
            transform: translateY(0);
        }

        /* =========================
           INDICATION BAS
        ========================= */

        .scroll-hint {
            position: absolute;

            bottom: 22px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 3;

            font-family: Arial, sans-serif;

            font-size: 9px;

            letter-spacing: 3px;

            text-transform: uppercase;

            color: rgba(255,255,255,0.7);

            opacity: 0;

            animation:
                fadeIn 1s ease 2s forwards,
                pulse 2.5s ease-in-out 2.5s infinite;
        }

        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes fadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }

        @keyframes fadeUp {

            from {
                opacity: 0;

                transform: translateY(25px);
            }

            to {
                opacity: 1;

                transform: translateY(0);
            }

        }

        @keyframes slideDown {

            from {
                opacity: 0;

                transform: translateY(-20px);
            }

            to {
                opacity: 1;

                transform: translateY(0);
            }

        }

        @keyframes pulse {

            0%,
            100% {
                opacity: .4;
            }

            50% {
                opacity: 1;
            }

        }

        @keyframes zoomPhoto {

            from {
                transform: scale(1.04);
            }

            to {
                transform: scale(1.12);
            }

        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            .small-title {
                font-size: 9px;

                letter-spacing: 4px;

                margin-bottom: 24px;
            }

            .names {
                font-size: 50px;
            }

            .ampersand {
                font-size: 30px;

                margin: 10px 0;
            }

            .date {
                font-size: 11px;

                letter-spacing: 3px;

                margin-top: 25px;
            }

            .message {
                font-size: 14px;

                max-width: 300px;
            }

            .open-button {
                padding: 14px 27px;

                font-size: 10px;
            }

        }

    </style>
</head>


<body>

    <main class="cover">

        <div class="decoration one"></div>

        <div class="decoration two"></div>

        <div class="line top"></div>

        <div class="line bottom"></div>


        <section class="content">

            <p class="small-title">
                Vous êtes invités
            </p>


            <h1 class="names">

                Epaphras

                <span class="ampersand">
                    &amp;
                </span>

                Consolate

            </h1>


            <p class="date">
                06 Juin 2027
            </p>


            <p class="message">

                Nous avons choisi de nous dire oui
                et nous serions heureux de vous compter
                parmi ceux qui partageront ce moment
                précieux avec nous.

            </p>


            <button
                class="open-button"
                onclick="ouvrirInvitation()"
            >

                Ouvrir l'invitation

            </button>

        </section>


        <p class="scroll-hint">
            Une histoire commence
        </p>

    </main>


    <script>

        function ouvrirInvitation() {

            alert(
                "Bienvenue dans l'invitation de Epaphras & Consolate ❤️"
            );

        }

    </script>

</body>

</html>
